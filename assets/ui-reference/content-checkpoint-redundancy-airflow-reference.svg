<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="675" viewBox="0 0 1600 675" role="img" aria-labelledby="title desc"><title id="title">Redundancy and airflow checkpoint reference</title><desc id="desc">Approved checkpoint layout with a large technical headline, three substantial concept cards, and a large complete rear-panel visual.</desc><rect width="1600" height="675" fill="#031f2b"/><text x="68" y="78" fill="#a9edf4" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">CHECKPOINT 3 · REDUNDANCY &amp; AIRFLOW</text><text x="68" y="150" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="53" font-weight="800">Rear-panel memory: 8 fans, 2</text><text x="68" y="212" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="53" font-weight="800">power supplies, front-to-rear</text><text x="68" y="274" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="53" font-weight="800">airflow</text><g font-family="Arial,sans-serif"><g transform="translate(68 305)"><rect width="720" height="95" rx="18" fill="#173c4c" stroke="#76e4ee" stroke-opacity=".25"/><rect x="18" y="18" width="54" height="59" rx="13" fill="#86e6ef"/><text x="29" y="55" fill="#054c60" font-size="24" font-weight="800">7+1</text><text x="90" y="42" fill="#f5fbfd" font-size="23" font-weight="700">Fan redundancy</text><text x="90" y="70" fill="#d5e9ee" font-size="19">Eight pluggable fan modules with hot-swap support.</text></g><g transform="translate(68 415)"><rect width="720" height="95" rx="18" fill="#173c4c" stroke="#76e4ee" stroke-opacity=".25"/><rect x="18" y="18" width="54" height="59" rx="13" fill="#86e6ef"/><text x="29" y="55" fill="#054c60" font-size="24" font-weight="800">1+1</text><text x="90" y="42" fill="#f5fbfd" font-size="23" font-weight="700">Power redundancy</text><text x="90" y="70" fill="#ffda63" font-size="19">Exception: 110 V AC does not support redundancy.</text></g><g transform="translate(68 525)"><rect width="720" height="95" rx="18" fill="#173c4c" stroke="#76e4ee" stroke-opacity=".25"/><rect x="18" y="18" width="54" height="59" rx="13" fill="#86e6ef"/><text x="35" y="56" fill="#054c60" font-size="31" font-weight="800">→</text><text x="90" y="42" fill="#f5fbfd" font-size="23" font-weight="700">Front-to-rear airflow</text><text x="90" y="70" fill="#d5e9ee" font-size="19">Port-side intake and power-side exhaust.</text></g></g><g transform="translate(835 105)"><rect width="700" height="475" rx="28" fill="#f3f5f6"/><rect width="700" height="8" rx="4" fill="#29c5d8"/><rect x="28" y="30" width="644" height="315" fill="#11171b"/><g transform="translate(60 85)"><rect width="580" height="205" rx="8" fill="#c9d1d4"/><rect x="25" y="26" width="70" height="150" rx="7" fill="#727e83"/><rect x="485" y="26" width="70" height="150" rx="7" fill="#727e83"/><g fill="#48575d" stroke="#111" stroke-width="2"><rect x="112" y="30" width="78" height="65"/><rect x="198" y="30" width="78" height="65"/><rect x="284" y="30" width="78" height="65"/><rect x="370" y="30" width="78" height="65"/><rect x="112" y="105" width="78" height="65"/><rect x="198" y="105" width="78" height="65"/><rect x="284" y="105" width="78" height="65"/><rect x="370" y="105" width="78" height="65"/></g><g fill="#9ccc50"><rect x="117" y="82" width="68" height="12"/><rect x="203" y="82" width="68" height="12"/><rect x="289" y="82" width="68" height="12"/><rect x="375" y="82" width="68" height="12"/><rect x="117" y="157" width="68" height="12"/><rect x="203" y="157" width="68" height="12"/><rect x="289" y="157" width="68" height="12"/><rect x="375" y="157" width="68" height="12"/></g></g><g transform="translate(30 370)" font-family="Arial" font-size="20" font-weight="700" fill="#07556a"><rect width="105" height="48" rx="14" fill="#e9fbfd" stroke="#8adce6"/><text x="18" y="31">8 × FAN</text><rect x="120" width="100" height="48" rx="14" fill="#e9fbfd" stroke="#8adce6"/><text x="140" y="31">2 × PSU</text><rect x="235" width="125" height="48" rx="14" fill="#e9fbfd" stroke="#8adce6"/><text x="255" y="31">Hot Swap</text></g></g></svg>
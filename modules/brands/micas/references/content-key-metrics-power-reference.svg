<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" role="img" aria-labelledby="title desc"><title id="title">Key metrics and power reference</title><desc id="desc">Approved full-width metrics layout with a large headline, four memorable specification cards, and a supporting power explanation band.</desc><rect width="1600" height="670" fill="#031f2b"/><text x="80" y="120" fill="#a9edf4" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">NUMBERS AN ENGINEER MUST REMEMBER</text><text x="80" y="188" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="52" font-weight="800">Do not memorize every specification—these four affect</text><text x="80" y="250" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="52" font-weight="800">installation and power</text><g transform="translate(80 285)" font-family="Arial,sans-serif"><g><rect width="330" height="115" rx="22" fill="#f7f7f5"/><circle cx="300" cy="18" r="42" fill="#d8f5f8"/><text x="25" y="58" fill="#00899f" font-size="38" font-weight="800">4 RU</text><text x="25" y="88" fill="#63747d" font-size="20">Rack height</text></g><g transform="translate(350)"><rect width="330" height="115" rx="22" fill="#f7f7f5"/><circle cx="300" cy="18" r="42" fill="#d8f5f8"/><text x="25" y="58" fill="#00899f" font-size="38" font-weight="800">48.9 kg</text><text x="25" y="88" fill="#63747d" font-size="20">Unit weight</text></g><g transform="translate(700)"><rect width="330" height="115" rx="22" fill="#f7f7f5"/><circle cx="300" cy="18" r="42" fill="#d8f5f8"/><text x="25" y="58" fill="#00899f" font-size="38" font-weight="800">1341 W</text><text x="25" y="88" fill="#63747d" font-size="20">Typical power</text></g><g transform="translate(1050)"><rect width="330" height="115" rx="22" fill="#f7f7f5"/><circle cx="300" cy="18" r="42" fill="#d8f5f8"/><text x="25" y="58" fill="#00899f" font-size="38" font-weight="800">1975 W</text><text x="25" y="88" fill="#63747d" font-size="20">Maximum power</text></g></g><g transform="translate(80 430)" font-family="Arial,sans-serif"><rect width="1380" height="145" rx="22" fill="#173c4c" stroke="#76e4ee" stroke-opacity=".28"/><text x="25" y="47" fill="#f5fbfd" font-size="25" font-weight="700">Rated AC input</text><text x="25" y="78" fill="#ffda63" font-size="21">100–120 V AC / 200–240 V AC · 50/60 Hz</text><text x="25" y="114" fill="#d5e9ee" font-size="18">Power inlet: C20; rated input current: 16 A.</text><text x="700" y="47" fill="#f5fbfd" font-size="25" font-weight="700">Why confirm PDU voltage?</text><text x="700" y="86" fill="#d5e9ee" font-size="18">At lower input voltage, each PSU has reduced output capacity, and</text><text x="700" y="114" fill="#d5e9ee" font-size="18">110 V AC does not support 1+1 power redundancy.</text></g></svg>
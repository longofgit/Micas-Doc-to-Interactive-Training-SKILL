<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="675" viewBox="0 0 1600 675" role="img" aria-labelledby="title desc"><title id="title">Product positioning checkpoint reference</title><desc id="desc">Approved checkpoint layout with a large positioning statement, three supporting cards, and a large complete product image.</desc><rect width="1600" height="675" fill="#031f2b"/><text x="68" y="74" fill="#a9edf4" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">CHECKPOINT 1 · WHAT IS IT?</text><text x="68" y="145" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="52" font-weight="800">One-line positioning: a high-</text><text x="68" y="206" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="52" font-weight="800">density 400GE core switch for</text><text x="68" y="267" fill="#f5fbfd" font-family="Arial,sans-serif" font-size="52" font-weight="800">AI data centers</text><g font-family="Arial,sans-serif"><g transform="translate(68 300)"><rect width="720" height="96" rx="18" fill="#173c4c" stroke="#76e4ee" stroke-opacity=".25"/><rect x="18" y="18" width="54" height="60" rx="13" fill="#86e6ef"/><text x="25" y="56" fill="#054c60" font-size="23" font-weight="800">128</text><text x="90" y="42" fill="#f5fbfd" font-size="23" font-weight="700">FR4 Service Ports</text><text x="90" y="72" fill="#d5e9ee" font-size="19">Supports 100G, 200G, and 400G uplink data transmission.</text></g><g transform="translate(68 411)"><rect width="720" height="116" rx="18" fill="#173c4c" stroke="#76e4ee" stroke-opacity=".25"/><rect x="18" y="20" width="54" height="60" rx="13" fill="#86e6ef"/><text x="33" y="57" fill="#054c60" font-size="25" font-weight="800">AI</text><text x="90" y="43" fill="#f5fbfd" font-size="23" font-weight="700">Target use</text><text x="90" y="73" fill="#d5e9ee" font-size="19">AI, top-of-rack uplink aggregation, and high-performance</text><text x="90" y="98" fill="#d5e9ee" font-size="19">data-center networks.</text></g><g transform="translate(68 542)"><rect width="720" height="96" rx="18" fill="#173c4c" stroke="#76e4ee" stroke-opacity=".25"/><rect x="18" y="18" width="54" height="60" rx="13" fill="#86e6ef"/><text x="31" y="57" fill="#054c60" font-size="28" font-weight="800">↔</text><text x="90" y="42" fill="#f5fbfd" font-size="23" font-weight="700">Modular design</text><text x="90" y="72" fill="#d5e9ee" font-size="19">Independent power and fan modules support field maintenance.</text></g></g><g transform="translate(835 105)"><rect width="700" height="475" rx="28" fill="#f3f5f6"/><rect width="700" height="8" rx="4" fill="#29c5d8"/><rect x="28" y="30" width="644" height="315" fill="#0d1114"/><g transform="translate(65 105)"><rect width="560" height="148" rx="7" fill="#cfd7da"/><rect x="10" y="45" width="540" height="62" fill="#74858c"/><g fill="#17262d"><rect x="22" y="55" width="18" height="42"/><rect x="48" y="55" width="18" height="42"/><rect x="74" y="55" width="18" height="42"/><rect x="100" y="55" width="18" height="42"/><rect x="126" y="55" width="18" height="42"/><rect x="152" y="55" width="18" height="42"/><rect x="178" y="55" width="18" height="42"/><rect x="204" y="55" width="18" height="42"/><rect x="230" y="55" width="18" height="42"/><rect x="256" y="55" width="18" height="42"/><rect x="282" y="55" width="18" height="42"/><rect x="308" y="55" width="18" height="42"/><rect x="334" y="55" width="18" height="42"/><rect x="360" y="55" width="18" height="42"/><rect x="386" y="55" width="18" height="42"/><rect x="412" y="55" width="18" height="42"/><rect x="438" y="55" width="18" height="42"/><rect x="464" y="55" width="18" height="42"/><rect x="490" y="55" width="18" height="42"/></g><rect x="200" y="116" width="160" height="24" rx="5" fill="#e9eef0"/></g><g transform="translate(30 370)" font-family="Arial" font-size="20" font-weight="700" fill="#07556a"><rect width="175" height="48" rx="14" fill="#e9fbfd" stroke="#8adce6"/><text x="18" y="31">High performance</text><rect x="190
name: Apply v2.3.2 autoplay narration patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-v2.3.2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted documentation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # SKILL.md
          p = 'SKILL.md'
          s = read(p)
          s = replace_once(s, 'version: 2.3.1', 'version: 2.3.2', 'SKILL version')
          s = replace_once(
              s,
              '- **Sequential navigation:** Next always advances through the global scene sequence; module and assessment boundaries never disable it\n',
              '- **Sequential navigation:** Next always advances through the global scene sequence; module and assessment boundaries never disable it\n- **Auto Play timing:** a narrated scene advances only after the complete narration for that scene has finished\n',
              'SKILL defaults autoplay'
          )
          anchor = '# 10. Narration and Google-First Voice Policy\n'
          section = '''## Auto Play Narration-Completion Contract\n\nWhen Auto Play or Video mode includes narration, the current scene must remain visible until the complete narration for that scene has finished.\n\n1. Do not advance with a fixed timer, estimated reading duration, character-count estimate, animation duration, or generic slide dwell while speech is still active.\n2. Advance only after the final `SpeechSynthesisUtterance.onend` event for the current scene's final narration chunk.\n3. If narration is split into multiple utterances, play them sequentially and resolve the scene only after the last chunk ends.\n4. While speech is paused, the page remains paused. Resume narration before any page transition.\n5. If narration errors or cannot start, stop Auto Play on the current scene; do not silently skip to the next page.\n6. Manual navigation must cancel the active utterance and invalidate its playback token so a stale `onend` callback cannot trigger an extra page advance.\n7. Existing assessment-introduction pause behavior remains unchanged.\n8. A scene with intentionally no narration may use a short configured visual dwell before advancing.\n\nRecommended implementation:\n\n```js\nlet autoPlayRunId = 0;\n\nfunction speakSceneNarration(chunks, voice) {\n  const runId = ++autoPlayRunId;\n\n  return new Promise((resolve, reject) => {\n    let index = 0;\n\n    const speakNextChunk = () => {\n      if (runId !== autoPlayRunId) return;\n      if (index >= chunks.length) {\n        resolve();\n        return;\n      }\n\n      const utterance = new SpeechSynthesisUtterance(chunks[index++]);\n      utterance.voice = voice;\n      utterance.onend = () => {\n        if (runId === autoPlayRunId) speakNextChunk();\n      };\n      utterance.onerror = event => {\n        if (runId === autoPlayRunId) reject(event);\n      };\n      speechSynthesis.speak(utterance);\n    };\n\n    speakNextChunk();\n  });\n}\n\nasync function playCurrentSceneThenAdvance() {\n  try {\n    const chunks = getCurrentSceneNarrationChunks();\n    if (chunks.length) {\n      await speakSceneNarration(chunks, selectedVoice);\n    } else {\n      await wait(NO_NARRATION_DWELL_MS);\n    }\n    if (autoPlayEnabled) goNext();\n  } catch (_) {\n    stopAutoPlay();\n  }\n}\n\nfunction cancelCurrentPlayback() {\n  autoPlayRunId += 1;\n  speechSynthesis.cancel();\n}\n```\n\nAdvancing before the final narration `onend` is a release-blocking defect.\n\n# 10. Narration and Google-First Voice Policy\n'''
          s = replace_once(s, anchor, section, 'SKILL autoplay contract')
          s = replace_once(
              s,
              '- global sequential navigation with no module or assessment gating;\n- right-aligned control cluster ordered Previous, Next, narration, Audio settings;\n',
              '- global sequential navigation with no module or assessment gating;\n- Auto Play waits for the final narration completion event before advancing;\n- right-aligned control cluster ordered Previous, Next, narration, Audio settings;\n',
              'SKILL implementation autoplay'
          )
          s = replace_once(
              s,
              '- verify the right-side footer order is Previous, Next, narration, Audio settings.\n',
              '- verify the right-side footer order is Previous, Next, narration, Audio settings;\n- verify Auto Play does not call `goNext()` before the final narration chunk fires `onend`;\n- verify pause/resume, narration errors, and manual cancellation cannot cause premature or duplicate advances.\n',
              'SKILL QA autoplay'
          )
          s = replace_once(
              s,
              '- footer controls are not right-aligned or are reordered;\n- first exam question appears without an assessment-introduction scene;\n',
              '- footer controls are not right-aligned or are reordered;\n- Auto Play advances while narration is still speaking, paused, or before the final narration `onend`;\n- a stale narration callback causes a duplicate page advance;\n- first exam question appears without an assessment-introduction scene;\n',
              'SKILL blockers autoplay'
          )
          write(p, s)

          # UI_DESIGN_SPEC.md
          p = 'UI_DESIGN_SPEC.md'
          s = read(p)
          s = replace_once(s, 'Version: **2.3.1**', 'Version: **2.3.2**', 'UI version')
          anchor = '# 11. Course Menu\n'
          section = '''## Auto Play Timing\n\n- Auto Play/Video mode must keep the current scene visible until that scene's complete narration has ended.\n- The next scene is triggered by the final utterance `onend`, not by a fixed timeout or estimated duration.\n- Multi-part narration waits for every chunk in order and advances only after the final chunk.\n- Pausing narration pauses the scene transition.\n- A narration error stops Auto Play on the current scene rather than skipping it.\n- Manual Previous/Next cancels and invalidates the active narration so stale callbacks cannot advance again.\n- Scenes with no narration may use a short explicit visual dwell.\n\n# 11. Course Menu\n'''
          s = replace_once(s, anchor, section, 'UI autoplay timing')
          s = replace_once(
              s,
              '- Next is disabled on a nonterminal scene, at a module boundary, or on an unanswered assessment question;\n- Previous, Next, narration, and Audio settings are not grouped at the far right in the required order;\n',
              '- Next is disabled on a nonterminal scene, at a module boundary, or on an unanswered assessment question;\n- Auto Play advances before the current scene narration finishes;\n- narration pause, error, cancellation, or stale callbacks cause premature or duplicate navigation;\n- Previous, Next, narration, and Audio settings are not grouped at the far right in the required order;\n',
              'UI acceptance autoplay'
          )
          write(p, s)

          # MASTER_PROMPT.md
          p = 'MASTER_PROMPT.md'
          s = read(p)
          anchor = '## Narration and Google-First Voices\n'
          section = '''## Auto Play Narration Timing\n\nWhen Auto Play or Video mode is active:\n\n- keep the current scene visible until its complete narration finishes;\n- advance only from the final narration utterance's `onend` event;\n- never use a fixed timer or estimated reading duration to advance while speech is active;\n- if narration is split into chunks, wait until the final chunk ends;\n- pausing narration must pause the page transition;\n- narration errors must stop Auto Play on the current scene rather than skip it;\n- manual navigation must cancel and invalidate active narration so stale callbacks cannot advance again;\n- only scenes with intentionally no narration may use a short explicit visual dwell.\n\n## Narration and Google-First Voices\n'''
          s = replace_once(s, anchor, section, 'MASTER autoplay timing')
          s = replace_once(
              s,
              '- the footer action group is right-aligned in the order Previous, Next, narration, Audio settings;\n- English remains the strongest visual master;\n',
              '- the footer action group is right-aligned in the order Previous, Next, narration, Audio settings;\n- Auto Play advances only after the final narration completion event and never while speech is active or paused;\n- English remains the strongest visual master;\n',
              'MASTER QA autoplay'
          )
          write(p, s)

          # QUICK_PROMPT.md
          p = 'QUICK_PROMPT.md'
          s = read(p)
          anchor = '## 语言按钮\n'
          section = '''## 自动播放时序\n\n- 点击Auto Play/Video mode后，本页必须一直停留到本页全部语音讲解完整播放结束。\n- 只能在最后一段语音触发`onend`后进入下一页。\n- 禁止按固定秒数、预计阅读时长、字数或动画时长提前翻页。\n- 如果旁白被拆成多段，必须依次播放，并等最后一段结束。\n- 暂停语音时页面也要暂停；语音恢复后继续。\n- 语音报错或无法启动时停止自动播放并停留在本页，不能直接跳过。\n- 手动翻页时要取消并失效当前语音回调，避免旧的`onend`再次触发翻页。\n- 只有本来就没有旁白的页面，才可以使用短暂的固定停留时间。\n\n'''
          s = replace_once(s, anchor, section + anchor, 'QUICK autoplay section')
          s = replace_once(
              s,
              '- Previous、Next、语音播放、Audio settings按固定顺序靠右；\n- 英文页面视觉效果最佳；\n',
              '- Previous、Next、语音播放、Audio settings按固定顺序靠右；\n- 自动播放必须等本页最后一段语音完整结束后才翻页，不得提前或重复跳页；\n- 英文页面视觉效果最佳；\n',
              'QUICK QA autoplay'
          )
          write(p, s)

          # README.md
          p = 'README.md'
          s = read(p)
          s = replace_once(s, 'Version: **2.3.1**', 'Version: **2.3.2**', 'README version')
          s = replace_once(
              s,
              '- Footer actions: right-aligned in the order Previous, Next, narration, Audio settings\n- Narration: compact icon controls with a curated popover\n',
              '- Footer actions: right-aligned in the order Previous, Next, narration, Audio settings\n- Auto Play: advances only after the current scene narration has fully completed\n- Narration: compact icon controls with a curated popover\n',
              'README defaults autoplay'
          )
          anchor = '## v2.3.1 Navigation and Footer Fix\n'
          section = '''## v2.3.2 Auto Play Narration Completion\n\n- Auto Play and Video mode now wait for the complete current-scene narration before advancing.\n- The final utterance `onend` is the navigation trigger; fixed timers and estimated durations are prohibited while narration is active.\n- Multi-chunk narration advances only after the last chunk.\n- Pause/resume preserves the current scene.\n- Narration errors stop Auto Play instead of skipping the scene.\n- Manual navigation invalidates stale narration callbacks to prevent duplicate advances.\n- No other UI, navigation, image, language, voice-selection, assessment, or layout rule changed.\n\n## v2.3.1 Navigation and Footer Fix\n'''
          s = replace_once(s, anchor, section, 'README v2.3.2 section')
          s = replace_once(
              s,
              '- navigation, audio, quizzes, scoring, persistence, fullscreen, and offline assets.\n',
              '- Auto Play waits for full narration completion and does not advance early or twice;\n- navigation, audio, quizzes, scoring, persistence, fullscreen, and offline assets.\n',
              'README QA autoplay'
          )
          write(p, s)

          # CHANGELOG.md
          p = 'CHANGELOG.md'
          s = read(p)
          anchor = '# Changelog\n\n'
          section = '''# Changelog\n\n## 2.3.2\n\n### Auto Play Narration Completion\n\n- Required Auto Play and Video mode to remain on the current scene until its complete narration finishes.\n- Made the final narration utterance `onend` the only normal narrated-scene advance trigger.\n- Prohibited fixed timers, estimated reading durations, character-count timing, and animation timing from advancing while speech is active.\n- Required multi-chunk narration to finish every chunk before navigation.\n- Required narration pause to pause page advancement.\n- Required narration errors to stop Auto Play on the current scene instead of skipping it.\n- Required manual navigation to invalidate stale narration callbacks and prevent duplicate page advances.\n\n### Scope\n\n- Made no other UI, navigation availability, footer alignment, image, language, voice-selection, assessment, or visual-design changes.\n\n'''
          s = replace_once(s, anchor, section, 'CHANGELOG v2.3.2')
          write(p, s)
          PY

          rm -f .github/workflows/patch-v2.3.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md UI_DESIGN_SPEC.md MASTER_PROMPT.md QUICK_PROMPT.md README.md CHANGELOG.md .github/workflows/patch-v2.3.2.yml
          git commit -m "Release v2.3.2 autoplay narration completion"
          git push origin main

name: Apply v2.3.3 header lockup reference

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-v2.3.3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted header-lockup patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # SKILL.md
          p = 'SKILL.md'
          s = read(p)
          s = replace_once(s, 'version: 2.3.2', 'version: 2.3.3', 'SKILL version')
          s = replace_once(
              s,
              '- **Visual direction:** dark, premium, technical, spacious, mission-oriented\n',
              '- **Visual direction:** dark, premium, technical, spacious, mission-oriented\n- **Header lockup:** large Micas logo with a stacked course title and product/module subtitle, following `assets/ui-reference/header-lockup-reference.svg`\n',
              'SKILL default header'
          )
          anchor = '# 8. Technical Image Integrity Contract\n'
          section = '''## Header Brand Lockup Contract

The upper-left header must follow the approved reference in `assets/ui-reference/header-lockup-reference.svg`.

Required composition:

1. Use one horizontal brand lockup: a large transparent Micas logo on the left and a two-line text block on its right.
2. The first text line is the course title. It is bold, bright, and visually dominant.
3. The second line is the product, platform, module, or course-context subtitle. It is smaller and uses the muted text color.
4. Vertically center the logo and text block inside the header.
5. Keep a generous gap between logo and text; do not crowd them together.
6. Keep the entire lockup on the deep-navy header background. Do not place it inside a card, white rectangle, or separate panel.
7. Use a restrained cyan/teal divider along the header bottom edge.
8. Header utilities remain on the far right and must not squeeze, overlap, or visually compete with the brand lockup.
9. On wide desktop screens, target approximately:
   - logo width: 190–250 px;
   - logo height: 52–72 px;
   - title: 30–44 px, bold;
   - subtitle: 18–28 px;
   - logo-to-text gap: 28–42 px.
10. At narrower widths, scale the whole lockup proportionally. Preserve the logo's readability and the title/subtitle hierarchy rather than shrinking only one element.
11. Avoid unnecessary title wrapping at required desktop viewports. If space is tight, shorten the contextual subtitle or compact right-side utilities before weakening the left lockup.
12. The reference image is supplemental visual guidance; implement the header with live HTML/CSS and the actual transparent Micas logo.

Recommended structure:

```html
<header class="course-header">
  <div class="brand-lockup">
    <img class="brand-logo" alt="Micas Networks">
    <div class="brand-copy">
      <div class="course-title">Micas CPO Training</div>
      <div class="course-subtitle">M2-W6940-128X1-FR4 Hardware</div>
    </div>
  </div>
  <div class="header-actions">...</div>
</header>
```

```css
.course-header {
  display: flex;
  align-items: center;
  gap: 24px;
  padding-inline: clamp(28px, 3vw, 56px);
  border-bottom: 1px solid rgba(118, 228, 238, .24);
}

.brand-lockup {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: clamp(28px, 2.4vw, 42px);
}

.brand-logo {
  width: clamp(190px, 15vw, 250px);
  max-height: 72px;
  object-fit: contain;
  flex: 0 0 auto;
}

.brand-copy {
  min-width: 0;
  display: grid;
  gap: 4px;
}

.course-title {
  font-size: clamp(30px, 2.45vw, 44px);
  line-height: 1.02;
  font-weight: 800;
  color: var(--micas-text);
}

.course-subtitle {
  font-size: clamp(18px, 1.55vw, 28px);
  line-height: 1.18;
  color: var(--micas-text-muted);
}

.header-actions {
  margin-left: auto;
  flex: 0 0 auto;
}
```

A tiny logo, weak title hierarchy, white logo box, misaligned logo/title block, or right-side controls squeezing the approved lockup is a release-blocking UI defect.

# 8. Technical Image Integrity Contract
'''
          s = replace_once(s, anchor, section, 'SKILL header contract')
          s = replace_once(
              s,
              '- verify header and footer remain visible;\n',
              '- verify header and footer remain visible;\n- verify the upper-left logo/title/subtitle lockup matches the approved reference proportions and alignment;\n',
              'SKILL QA header'
          )
          s = replace_once(
              s,
              '- tiny/shrunken primary controls;\n',
              '- tiny/shrunken primary controls;\n- upper-left brand lockup has a tiny logo, weak hierarchy, white box, misalignment, overlap, or crowding;\n',
              'SKILL blocker header'
          )
          write(p, s)

          # UI_DESIGN_SPEC.md
          p = 'UI_DESIGN_SPEC.md'
          s = read(p)
          s = replace_once(s, 'Version: **2.3.2**', 'Version: **2.3.3**', 'UI version')
          anchor = '# 8. Header\n\nHeader content:\n'
          section = '''# 8. Header

The upper-left header lockup must use `assets/ui-reference/header-lockup-reference.svg` as the approved visual reference.

## Required Brand Lockup

- One horizontal lockup: large transparent Micas logo on the left, stacked title/subtitle on the right.
- Course title: bold white, clearly dominant.
- Product/module subtitle: smaller muted blue-white text.
- Logo and text are vertically centered as one unit.
- Keep generous spacing between the logo and text block.
- Do not wrap the lockup in a card or white panel.
- Keep a subtle cyan divider at the header bottom.
- Keep language, Video, Fullscreen, and other utilities at the far right without compressing the lockup.

Desktop target ranges:

```css
.course-header {
  display: flex;
  align-items: center;
  min-width: 0;
  padding-inline: clamp(28px, 3vw, 56px);
  border-bottom: 1px solid rgba(118, 228, 238, .24);
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: clamp(28px, 2.4vw, 42px);
  min-width: 0;
}

.brand-logo {
  width: clamp(190px, 15vw, 250px);
  max-height: 72px;
  object-fit: contain;
  flex: 0 0 auto;
}

.brand-copy {
  display: grid;
  gap: 4px;
  min-width: 0;
}

.brand-copy .course-title {
  font-size: clamp(30px, 2.45vw, 44px);
  line-height: 1.02;
  font-weight: 800;
  color: var(--micas-text);
}

.brand-copy .course-subtitle {
  font-size: clamp(18px, 1.55vw, 28px);
  line-height: 1.18;
  color: var(--micas-text-muted);

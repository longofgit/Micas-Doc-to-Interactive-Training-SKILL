```

Responsive priority:

1. Preserve the logo, title, subtitle hierarchy.
2. Compact nonessential right-side utility labels before shrinking the lockup below its readable minimum.
3. Shorten the contextual subtitle before wrapping the main course title unnecessarily.
4. On compact/mobile layouts, use a proportional compact lockup rather than a different visual identity.
5. Never allow header actions to overlap or force the logo/title off-screen.

The reference asset is part of the Skill for visual inspection. Generated courses must recreate the pattern with live HTML/CSS and the proper transparent logo; do not embed the screenshot itself as the course header.

Header content:
'''
          s = replace_once(s, anchor, section, 'UI header lockup')
          s = replace_once(
              s,
              '- header/footer is clipped;\n',
              '- header/footer is clipped;\n- the upper-left Micas logo/title/subtitle lockup does not match the approved reference hierarchy, sizing, spacing, or alignment;\n',
              'UI acceptance header'
          )
          write(p, s)

          # MASTER_PROMPT.md
          p = 'MASTER_PROMPT.md'
          s = read(p)
          anchor = '## Header and Language\n\nHeader contains:\n'
          section = '''## Header Brand Lockup

Follow `assets/ui-reference/header-lockup-reference.svg` for the upper-left header style.

- Place a large transparent Micas logo on the left.
- Place a stacked text block immediately to its right: bold white course title above a smaller muted product/module subtitle.
- Vertically center the logo and both text lines as one lockup.
- Use generous logo-to-text spacing and a subtle cyan divider along the bottom of the header.
- Keep the lockup directly on the deep-navy background; no white box, card, or separate panel.
- Keep header utilities on the far right and prevent them from shrinking, wrapping, overlapping, or visually competing with the lockup.
- Recreate the style with live HTML/CSS and the actual logo. The screenshot is a visual reference, not a bitmap header to embed.
- At desktop widths, target a roughly 190–250 px logo, 30–44 px title, and 18–28 px subtitle while preserving the one-screen viewport contract.

## Header and Language

Header contains:
'''
          s = replace_once(s, anchor, section, 'MASTER header lockup')
          s = replace_once(
              s,
              '- no header/footer clipping;\n',
              '- no header/footer clipping;\n- the upper-left logo/title/subtitle lockup matches the approved reference style and remains clear at every required viewport;\n',
              'MASTER QA header'
          )
          write(p, s)

          # QUICK_PROMPT.md
          p = 'QUICK_PROMPT.md'
          s = read(p)
          anchor = '## UI与品牌\n\n'
          section = '''## 左上角Header样式

- 左上角必须参考Skill内的`assets/ui-reference/header-lockup-reference.svg`。
- 使用一行横向品牌区：左侧放较大的透明Micas Logo，右侧放上下两行文字。
- 第一行是课程标题，白色、粗体、明显突出；第二行是产品/模块副标题，字号更小、颜色更柔和。
- Logo和两行文字作为一个整体垂直居中，Logo与文字之间保留宽松间距。
- 整个品牌区直接融合在深蓝Header背景中，不要白底、卡片或独立面板。
- Header底部保留细的青蓝色分隔线。
- 语言、Video和Fullscreen等按钮继续放最右侧，不能挤压、遮挡或削弱左侧品牌区。
- 桌面端可参考：Logo宽约190–250px，标题30–44px，副标题18–28px。
- 必须用真实Logo和HTML/CSS重现这种样式，不能直接把参考截图作为Header图片。

## UI与品牌

'''
          s = replace_once(s, anchor, section, 'QUICK header section')
          s = replace_once(
              s,
              '- 所有桌面按钮尺寸正常；\n',
              '- 所有桌面按钮尺寸正常；\n- 左上角Logo、课程标题和产品/模块副标题符合参考图的尺寸、层级、间距与对齐；\n',
              'QUICK QA header'
          )
          write(p, s)

          # README.md
          p = 'README.md'
          s = read(p)
          s = replace_once(s, 'Version: **2.3.2**', 'Version: **2.3.3**', 'README version')
          s = replace_once(
              s,
              '- `CHANGELOG.md` — release history.\n',
              '- `CHANGELOG.md` — release history.\n- `assets/ui-reference/header-lockup-reference.svg` — approved upper-left header composition reference.\n- `assets/ui-reference/README.md` — explains how agents should use the visual reference.\n',
              'README asset contents'
          )
          s = replace_once(
              s,
              '- Visual style: dark premium technical presentation based on the successful preview design\n',
              '- Visual style: dark premium technical presentation based on the successful preview design\n- Header lockup: large Micas logo plus stacked course title and product/module subtitle, based on the bundled reference image\n',
              'README default header'
          )
          anchor = '## v2.3.2 Auto Play Narration Completion\n'
          section = '''## v2.3.3 Header Brand Lockup Reference

- Added `assets/ui-reference/header-lockup-reference.svg` as an approved visual reference inside the Skill package.
- Added a companion asset README explaining that the screenshot is supplemental guidance and must not be embedded directly as the generated header.
- Required a large transparent Micas logo on the left with a stacked bold course title and muted product/module subtitle on the right.
- Added desktop sizing, spacing, alignment, divider, responsive-priority, and right-side utility rules.
- Added QA and release-blocking checks for tiny logos, weak hierarchy, white boxes, overlap, crowding, and misalignment.
- Made no changes to navigation, footer order, Auto Play, narration, assessment, image handling, language behavior, or other scene-layout rules.

## v2.3.2 Auto Play Narration Completion
'''
          s = replace_once(s, anchor, section, 'README v2.3.3 section')
          write(p, s)

          # CHANGELOG.md
          p = 'CHANGELOG.md'
          s = read(p)
          anchor = '# Changelog\n\n'
          section = '''# Changelog

## 2.3.3

### Header Brand Lockup

- Added the approved upper-left header screenshot to `assets/ui-reference/header-lockup-reference.svg`.
- Added `assets/ui-reference/README.md` to explain how the reference should be interpreted.
- Required a large transparent Micas logo with a stacked course title and product/module subtitle.
- Added explicit sizing, spacing, vertical alignment, deep-navy integration, cyan divider, and responsive-priority rules.
- Required far-right header utilities not to compress or compete with the left brand lockup.
- Added QA and release blockers for tiny logos, weak title hierarchy, white boxes, overlap, crowding, and misalignment.

### Scope

- Changed only the upper-left header visual specification and bundled reference assets.
- Did not change navigation, footer alignment, Auto Play, narration, voice selection, assessment, image handling, language behavior, or other course UI rules.

'''
          s = replace_once(s, anchor, section, 'CHANGELOG v2.3.3')
          write(p, s)
          PY

          rm -f .github/workflows/patch-v2.3.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md UI_DESIGN_SPEC.md MASTER_PROMPT.md QUICK_PROMPT.md README.md CHANGELOG.md .github/workflows/patch-v2.3.3.yml
          git commit -m "Release v2.3.3 header brand lockup reference"
          git push origin main
